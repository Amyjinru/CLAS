# CLAS 自动部署工作流
# 推送 dev 分支后自动触发，通过 SSH 连接服务器执行部署。
#
# 认证方式: SSH 密码（存储在 GitHub Secrets → SSH_PASSWORD）
#   本地开发机另配置了 SSH 密钥免密登录，可运行 scripts/deploy.ps1 手动部署。
#
# 故障排查:
#   若部署成功但服务行为未变 → 可能是旧 nohup 进程残留占端口
#   本工作流已内置清理逻辑，部署前自动杀掉非 systemd 管理的 Java 进程

name: Deploy to Cloud Server

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Network connectivity check
        run: |
          echo "Testing TCP reachability..."
          timeout 10 bash -c 'echo >/dev/tcp/8.141.112.182/22 && echo "OK" || echo "UNREACHABLE"'
        continue-on-error: true

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Cleanup zombie Java processes & Deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@8.141.112.182 "
            set -e
            echo '>>> 清理残留的非 systemd Java 进程...'
            old_pids=\$(ps aux | grep 'java -jar' | grep -v grep | grep -v systemd | awk '{print \$2}')
            if [ -n \"\$old_pids\" ]; then
              echo \"Killing: \$old_pids\"
              kill -9 \$old_pids 2>/dev/null || true
              sleep 2
              systemctl restart clas-backend
              echo '>>> 服务已重启'
            fi

            cd /opt/clas
            echo '>>> 同步代码到 upstream/dev...'
            git fetch upstream dev
            git reset --hard upstream/dev
            git clean -fd

            echo '>>> 构建并部署...'
            clas deploy

            echo '>>> 健康检查...'
            sleep 2
            curl -sf http://127.0.0.1:8080/api/health
            echo
            echo '>>> 当前部署版本:'
            git log -1 --oneline
          "
