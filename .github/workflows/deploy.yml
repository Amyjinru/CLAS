name: Build and publish CLAS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      force_test_failure:
        description: "仅用于验收流水线阻断能力，不会发布或部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: clas-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: amyjinru

jobs:
  changes:
    name: Classify delivery scope
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      services: ${{ steps.scope.outputs.services }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Classify changed files
        id: scope
        shell: bash
        run: |
          # 所有可独立构建部署的微服务（不含共享库 clas-common，也不含废弃原型 catalog-service）
          all_services=(clas-iam clas-merchant clas-catalog clas-order clas-compat)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            printf -v joined '%s,' "${all_services[@]}"
            echo "services=${joined%,}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy=false
          # 用关联数组记录受影响的微服务；共享库或跨切面文件命中则全量
          declare -A affected
          full_deploy=false

          while IFS= read -r file; do
            case "$file" in
              # 纯测试/文档类变更不触发任何构建
              backend/src/test/*|tests/*|*.test.js|*.test.ts|*.spec.js|*.spec.ts|docs/*|openspec/*|*.md) ;;

              # 共享库变更影响全部微服务
              services/clas-common/*)
                full_deploy=true; deploy=true;;

              # 单个微服务目录变更 → 只影响该服务
              services/clas-iam/*)   affected[clas-iam]=1;   deploy=true;;
              services/clas-merchant/*) affected[clas-merchant]=1; deploy=true;;
              services/clas-catalog/*)  affected[clas-catalog]=1;  deploy=true;;
              services/clas-order/*)    affected[clas-order]=1;    deploy=true;;
              services/clas-compat/*)   affected[clas-compat]=1;   deploy=true;;

              # 跨切面文件（基础设施/数据库/网关/前端/单体）→ 保守全量部署
              backend/*|database/*|k8s/*|scripts/k8s/*|frontend/*|docker-compose.yml|.github/workflows/deploy.yml)
                full_deploy=true; deploy=true;;
            esac
          done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

          if [[ "$full_deploy" == "true" ]]; then
            affected=()
            for svc in "${all_services[@]}"; do affected[$svc]=1; done
          fi

          # 输出逗号分隔的受影响服务列表（若 deploy=false 则为空）
          services=""
          for svc in "${all_services[@]}"; do
            if [[ -n "${affected[$svc]:-}" ]]; then
              if [[ -z "$services" ]]; then services="$svc"; else services="$services,$svc"; fi
            fi
          done

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "classified services: $services"

  verify:
    name: Test gate
    runs-on: ubuntu-latest
    # 冒烟测试包含镜像构建与服务健康检查；总时限避免异常 Docker 任务无限占用发布队列。
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify failure gate can stop delivery
        if: ${{ inputs.force_test_failure }}
        run: |
          echo "Intentional verification failure: publish and deploy must not run."
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend unit and integration tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Run microservice unit tests
        working-directory: services
        run: mvn --batch-mode clean test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run clean Docker Compose smoke test
        # 单次启动理论上最多 240 秒，连同构建与三次重试留出余量后仍必须受限。
        timeout-minutes: 20
        run: |
          {
            echo "MYSQL_DATABASE=clas"
            echo "MYSQL_USER=clas"
            echo "MYSQL_PASSWORD=clas-test-password"
            echo "MYSQL_ROOT_PASSWORD=clas-root-password"
          echo "JWT_SECRET=0123456789abcdef0123456789abcdef"
          echo "RIDER_IDENTITY_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef"
          } > ci-compose.env
          for attempt in 1 2 3; do
            if timeout 360s docker compose --env-file ci-compose.env up --build --detach --wait --wait-timeout 240; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Compose 镜像构建或启动连续三次失败" >&2
              exit 1
            fi
            docker compose --env-file ci-compose.env down --volumes --remove-orphans || true
            echo "Compose 启动第 ${attempt} 次失败，30 秒后重试以应对镜像仓库瞬时故障。" >&2
            sleep 30
          done
          pwsh -File scripts/compose-smoke.ps1

      - name: Collect Compose diagnostics
        if: always()
        run: docker compose --env-file ci-compose.env logs --no-color > compose.log || true

      - name: Stop Compose test environment
        if: always()
        run: docker compose --env-file ci-compose.env down --volumes --remove-orphans || true

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            services/*/target/surefire-reports/
            frontend/test-results/
            compose.log
          if-no-files-found: warn

  publish:
    name: Build and publish immutable images
    needs: [verify, changes]
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    env:
      # 逗号分隔的受影响微服务列表，仅用于记录本次变更范围。
      CHANGED_SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve image version
        id: version
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve microservice build matrix
        id: matrix
        shell: bash
        run: |
          # 所有 Deployment 共用同一个不可变 Git SHA。为保证任意节点都能
          # 导入并启动该版本，每次发布必须构建和打包完整微服务集合。
          all_services=(clas-iam clas-merchant clas-catalog clas-order clas-compat)
          printf -v joined '%s,' "${all_services[@]}"
          echo "services=${joined%,}" >> "$GITHUB_OUTPUT"
          echo "changed services: ${CHANGED_SERVICES:-none}; release services: ${joined%,}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-frontend:${GITHUB_SHA}"
          docker build --file frontend/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee frontend-image.txt

      - name: Build and push database migration image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-database:${GITHUB_SHA}"
          docker build --file database/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee database-image.txt

      - name: Build and push microservice images
        shell: bash
        run: |
          IFS=',' read -r -a services <<< "${{ steps.matrix.outputs.services }}"
          for service in "${services[@]}"; do
            [ -z "$service" ] && continue
            image="${REGISTRY}/${IMAGE_OWNER}/${service}:${GITHUB_SHA}"
            docker build --file services/Dockerfile --build-arg SERVICE_MODULE="$service" --tag "$image" services
            docker push "$image"
            docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee "${service}-image.txt"
          done

      - name: Upload image references
        uses: actions/upload-artifact@v6
        with:
          name: image-references-${{ github.sha }}
          path: |
            frontend-image.txt
            database-image.txt
            clas-iam-image.txt
            clas-merchant-image.txt
            clas-catalog-image.txt
            clas-order-image.txt
            clas-compat-image.txt
          if-no-files-found: warn

      - name: Package tested images for server import
        shell: bash
        run: |
          images=(
            "${REGISTRY}/${IMAGE_OWNER}/clas-frontend:${GITHUB_SHA}"
            "${REGISTRY}/${IMAGE_OWNER}/clas-database:${GITHUB_SHA}"
          )
          IFS=',' read -r -a services <<< "${{ steps.matrix.outputs.services }}"
          for service in "${services[@]}"; do
            [ -z "$service" ] && continue
            images+=("${REGISTRY}/${IMAGE_OWNER}/${service}:${GITHUB_SHA}")
          done
          docker save "${images[@]}" | gzip -1 > "clas-images-${GITHUB_SHA}.tar.gz"

      - name: Upload deployable image archive
        uses: actions/upload-artifact@v6
        with:
          name: deployable-images-${{ github.sha }}
          path: clas-images-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy:
    name: Deploy immutable version to k3s
    needs: publish
    # 旧服务器已退役。新 ECS 由 deploy-new-ecs.yml 在发布成功后接管，
    # 禁止 main 推送继续连接旧主机。
    if: ${{ false }}
    runs-on: ubuntu-latest
    # 保留历史诊断定义；该 Job 被上方条件永久跳过。
    continue-on-error: true
    # 恢复（5 分钟）+ 本地导入镜像（15 分钟）+ 应用部署（30 分钟）均有
    # 独立上限；任务总时限略高于它们的和，确保失败时仍能采集诊断。
    timeout-minutes: 60
    env:
      SERVER_HOST: 8.141.112.182
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLAS_INTERNAL_API_KEY: ${{ secrets.CLAS_INTERNAL_API_KEY }}
      RIDER_IDENTITY_ENCRYPTION_KEY: ${{ secrets.RIDER_IDENTITY_ENCRYPTION_KEY }}
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
      CLAS_DEMO_ACCESS_PASSWORD: ${{ secrets.CLAS_DEMO_ACCESS_PASSWORD }}
      CLAS_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/k8s

      - name: Download deployable image archive
        uses: actions/download-artifact@v6
        with:
          name: deployable-images-${{ github.sha }}
          path: ${{ runner.temp }}/clas-images

      - name: Prepare secret deployment input
        run: |
          test -n "$SSH_PASSWORD" || { echo 'SSH_PASSWORD is required'; exit 1; }
          test -n "$GHCR_USERNAME" || { echo 'GHCR_USERNAME is required'; exit 1; }
          test -n "$GHCR_TOKEN" || { echo 'GHCR_PULL_TOKEN is required'; exit 1; }
          test -n "$MYSQL_PASSWORD" || { echo 'MYSQL_PASSWORD is required'; exit 1; }
          test -n "$JWT_SECRET" || { echo 'JWT_SECRET is required'; exit 1; }
          test -n "$RIDER_IDENTITY_ENCRYPTION_KEY" || { echo 'RIDER_IDENTITY_ENCRYPTION_KEY is required'; exit 1; }
          if [[ -z "$CLAS_INTERNAL_API_KEY" ]]; then
            echo 'CLAS_INTERNAL_API_KEY is not configured; deriving a stable, domain-separated key from JWT_SECRET.'
            CLAS_INTERNAL_API_KEY="$(printf 'clas-internal-api:%s' "$JWT_SECRET" | sha256sum | cut -d ' ' -f 1)"
          fi
          umask 077
          cat > "$RUNNER_TEMP/clas-deploy.env" <<EOF
          GHCR_USERNAME=$GHCR_USERNAME
          GHCR_TOKEN=$GHCR_TOKEN
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          JWT_SECRET=$JWT_SECRET
          CLAS_INTERNAL_API_KEY=$CLAS_INTERNAL_API_KEY
          RIDER_IDENTITY_ENCRYPTION_KEY=$RIDER_IDENTITY_ENCRYPTION_KEY
          AMAP_WEB_SERVICE_KEY=$AMAP_WEB_SERVICE_KEY
          DASHSCOPE_API_KEY=$DASHSCOPE_API_KEY
          FORBIDDEN_WORDS=$FORBIDDEN_WORDS
          CLAS_DEMO_ACCESS_PASSWORD=$CLAS_DEMO_ACCESS_PASSWORD
          CLAS_IMAGE_TAG=$CLAS_IMAGE_TAG
          CLAS_STOP_LEGACY_NGINX=true
          EOF

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Wait for server SSH recovery
        shell: bash
        run: |
          # A busy k3s node can finish its transient recovery after the first
          # SCP retry window. Wait for a complete SSH handshake before trying
          # to transfer deployment inputs, while still failing deterministically
          # if the host remains unavailable.
          ssh_options="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          for attempt in $(seq 1 20); do
            if sshpass -p "$SSH_PASSWORD" ssh $ssh_options "root@${SERVER_HOST}" 'exit 0'; then
              echo "Server SSH is ready (attempt ${attempt}/20)."
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              echo "Server SSH has not completed a handshake (attempt ${attempt}/20); retrying in 10 seconds." >&2
              sleep 10
            fi
          done
          echo 'Server SSH did not recover within 10 minutes; inspect or restart the host from the cloud console.' >&2
          exit 1

      - name: Recover k3s control plane
        run: |
          deploy_env="/tmp/clas-deploy.env"
          ssh_options="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          retry_scp() {
            local attempt
            for attempt in $(seq 1 8); do
              if sshpass -p "$SSH_PASSWORD" scp $ssh_options "$1" "$2"; then
                return 0
              fi
              if [ "$attempt" -lt 8 ]; then
                echo "SSH transfer failed (attempt ${attempt}/8); retrying in 15 seconds." >&2
                sleep 15
              fi
            done
            echo "SSH transfer failed after 8 attempts: $1" >&2
            return 1
          }
          retry_scp "$RUNNER_TEMP/clas-deploy.env" "root@${SERVER_HOST}:$deploy_env"
          # 控制面恢复本身也必须有边界；否则 systemctl 或 SSH 会话卡住时，
          # 后续 deploy.sh 的超时保护永远不会被执行。
          timeout 600s sshpass -p "$SSH_PASSWORD" ssh $ssh_options "root@${SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          deploy_env="/tmp/clas-deploy.env"
          set -a
          . /etc/clas/clas.env
          . "$deploy_env"
          set +a
          if ! timeout 20 kubectl get --raw=/readyz >/dev/null 2>&1; then
            echo 'k3s API is unhealthy; restarting the local control plane.'
            timeout 90s systemctl restart k3s
            api_ready=false
            for _ in $(seq 1 60); do
              if timeout 5 kubectl get --raw=/readyz >/dev/null 2>&1; then
                api_ready=true
                break
              fi
              sleep 2
            done
            if [ "$api_ready" != true ]; then
              echo 'k3s API did not recover after restart.' >&2
              systemctl status k3s --no-pager -n 100 >&2 || true
              exit 1
            fi
          fi

          # readyz 只代表 API Server 可访问，并不代表 CNI 已恢复。之前的故障
          # 中 Flannel 的 subnet.env 缺失，导致所有新 Pod 无法创建网络沙箱。
          flannel_ready=false
          for _ in $(seq 1 30); do
            if [ -s /run/flannel/subnet.env ]; then
              flannel_ready=true
              break
            fi
            sleep 2
          done
          if [ "$flannel_ready" != true ]; then
            # API 已就绪而 CNI 文件缺失时，前一版仅等待会必然失败。
            # 重启一次 k3s 以重新拉起内置 Flannel，再验证两个就绪条件。
            echo 'Flannel CNI is missing although the API is ready; restarting k3s once.' >&2
            timeout 90s systemctl restart k3s
            api_ready=false
            for _ in $(seq 1 60); do
              if timeout 5 kubectl get --raw=/readyz >/dev/null 2>&1; then
                api_ready=true
                break
              fi
              sleep 2
            done
            if [ "$api_ready" != true ]; then
              echo 'k3s API did not recover after the Flannel recovery restart.' >&2
              exit 1
            fi
            for _ in $(seq 1 60); do
              if [ -s /run/flannel/subnet.env ]; then
                flannel_ready=true
                break
              fi
              sleep 2
            done
            if [ "$flannel_ready" != true ]; then
              echo 'Flannel CNI did not restore /run/flannel/subnet.env after restart.' >&2
              kubectl -n kube-system get pod -o wide >&2 || true
              systemctl status k3s --no-pager -n 100 >&2 || true
              exit 1
            fi
          fi
          REMOTE

      - name: Deploy tested image version through server-local k3s API
        run: |
          deploy_env="/tmp/clas-deploy.env"
          image_archive="/tmp/clas-images-${CLAS_IMAGE_TAG}.tar.gz"
          ssh_options="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          retry_image_transfer() {
            local attempt
            for attempt in $(seq 1 8); do
              if sshpass -p "$SSH_PASSWORD" scp $ssh_options "$RUNNER_TEMP/clas-images/clas-images-${CLAS_IMAGE_TAG}.tar.gz" "root@${SERVER_HOST}:$image_archive"; then
                return 0
              fi
              if [ "$attempt" -lt 8 ]; then
                echo "Image transfer failed (attempt ${attempt}/8); retrying in 15 seconds." >&2
                sleep 15
              fi
            done
            echo 'Image transfer failed after 8 attempts.' >&2
            return 1
          }
          retry_image_transfer
          sshpass -p "$SSH_PASSWORD" ssh $ssh_options "root@${SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          deploy_env="/tmp/clas-deploy.env"
          set -a
          . /etc/clas/clas.env
          . "$deploy_env"
          set +a
          image_archive="/tmp/clas-images-${CLAS_IMAGE_TAG}.tar.gz"
          trap 'rm -f "$deploy_env" "$image_archive"' EXIT
          if [ ! -d /opt/clas-k8s/.git ]; then
            git clone --no-checkout --origin upstream https://github.com/Amyjinru/CLAS.git /opt/clas-k8s
          fi
          cd /opt/clas-k8s
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/k8s/**' '/scripts/k8s/**' '/database/**'
          git fetch upstream main
          git checkout --detach "$CLAS_IMAGE_TAG"
          test "$(git rev-parse HEAD)" = "$CLAS_IMAGE_TAG"
          test -s "$image_archive"
          # 镜像导入同样可能在磁盘或 containerd 异常时无输出地阻塞。
          timeout --foreground --signal=TERM --kill-after=60s 900s \
            k3s ctr -n k8s.io images import "$image_archive"
          # 远端 k3s 失去 API 响应时，不能让 SSH 会话与整个发布一直悬挂。
          # 超时后 deploy.sh 的 ERR trap 会采集诊断并尝试回滚，CI 随后上传证据。
          timeout --foreground --signal=TERM --kill-after=60s 1800s \
            bash scripts/k8s/deploy.sh "$CLAS_IMAGE_TAG"
          REMOTE

      - name: Remove temporary server deployment inputs
        if: always()
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "root@${SERVER_HOST}" \
            "rm -f /tmp/clas-deploy.env /tmp/clas-images-${CLAS_IMAGE_TAG}.tar.gz /tmp/clas-quiesce-apps.sh" || true

      - name: Collect server deployment diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-diagnostics"
          # 故障主机可能仍能建立 TCP 连接却无法完成 SSH 会话。诊断采集必须
          # 有独立上限，否则失败发布会永远占用生产发布队列。
          timeout 120s sshpass -p "$SSH_PASSWORD" scp -r \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@${SERVER_HOST}:/opt/clas-k8s/artifacts/k8s-diagnostics/." "$RUNNER_TEMP/k8s-diagnostics/" || true

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k3s-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/k8s-diagnostics/
          if-no-files-found: warn
