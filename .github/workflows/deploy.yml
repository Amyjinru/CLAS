name: Build, publish and deploy CLAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: amyjinru

jobs:
  verify:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend unit and integration tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
          if-no-files-found: warn

  publish:
    name: Build and publish immutable images
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-backend:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee backend-image.txt

      - name: Build and push frontend image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-frontend:${GITHUB_SHA}"
          docker build --file frontend/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee frontend-image.txt

      - name: Upload image references
        uses: actions/upload-artifact@v4
        with:
          name: image-references-${{ github.sha }}
          path: |
            backend-image.txt
            frontend-image.txt

  deploy:
    name: Deploy immutable version to k3s
    needs: publish
    runs-on: ubuntu-latest
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RIDER_IDENTITY_ENCRYPTION_KEY: ${{ secrets.RIDER_IDENTITY_ENCRYPTION_KEY }}
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
      CLAS_DEMO_ACCESS_PASSWORD: ${{ secrets.CLAS_DEMO_ACCESS_PASSWORD }}
      CLAS_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      CLAS_DEPLOY_ARTIFACT_DIR: ${{ github.workspace }}/k8s-diagnostics
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          test -n "$KUBECONFIG_B64" || { echo 'KUBECONFIG_B64 is required'; exit 1; }
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy tested image version
        run: bash scripts/k8s/deploy.sh

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3s-diagnostics-${{ github.sha }}
          path: k8s-diagnostics/
          if-no-files-found: warn
