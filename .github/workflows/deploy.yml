name: Build, publish and deploy CLAS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_test_failure:
        description: "仅用于验收流水线阻断能力，不会发布或部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: clas-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: amyjinru

jobs:
  verify:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify failure gate can stop delivery
        if: ${{ inputs.force_test_failure }}
        run: |
          echo "Intentional verification failure: publish and deploy must not run."
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend unit and integration tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
          if-no-files-found: warn

  publish:
    name: Build and publish immutable images
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve image version
        id: version
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-backend:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee backend-image.txt

      - name: Build and push frontend image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-frontend:${GITHUB_SHA}"
          docker build --file frontend/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee frontend-image.txt

      - name: Build and push database migration image
        run: |
          image="${REGISTRY}/${IMAGE_OWNER}/clas-database:${GITHUB_SHA}"
          docker build --file database/Dockerfile --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee database-image.txt

      - name: Upload image references
        uses: actions/upload-artifact@v6
        with:
          name: image-references-${{ github.sha }}
          path: |
            backend-image.txt
            frontend-image.txt
            database-image.txt

  deploy:
    name: Deploy immutable version to k3s
    needs: publish
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: 8.141.112.182
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RIDER_IDENTITY_ENCRYPTION_KEY: ${{ secrets.RIDER_IDENTITY_ENCRYPTION_KEY }}
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
      CLAS_DEMO_ACCESS_PASSWORD: ${{ secrets.CLAS_DEMO_ACCESS_PASSWORD }}
      CLAS_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
    steps:
      - name: Prepare secret deployment input
        run: |
          test -n "$SSH_PASSWORD" || { echo 'SSH_PASSWORD is required'; exit 1; }
          test -n "$GHCR_USERNAME" || { echo 'GHCR_USERNAME is required'; exit 1; }
          test -n "$GHCR_TOKEN" || { echo 'GHCR_PULL_TOKEN is required'; exit 1; }
          test -n "$MYSQL_PASSWORD" || { echo 'MYSQL_PASSWORD is required'; exit 1; }
          test -n "$JWT_SECRET" || { echo 'JWT_SECRET is required'; exit 1; }
          test -n "$RIDER_IDENTITY_ENCRYPTION_KEY" || { echo 'RIDER_IDENTITY_ENCRYPTION_KEY is required'; exit 1; }
          umask 077
          cat > "$RUNNER_TEMP/clas-deploy.env" <<EOF
          GHCR_USERNAME=$GHCR_USERNAME
          GHCR_TOKEN=$GHCR_TOKEN
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          JWT_SECRET=$JWT_SECRET
          RIDER_IDENTITY_ENCRYPTION_KEY=$RIDER_IDENTITY_ENCRYPTION_KEY
          AMAP_WEB_SERVICE_KEY=$AMAP_WEB_SERVICE_KEY
          DASHSCOPE_API_KEY=$DASHSCOPE_API_KEY
          FORBIDDEN_WORDS=$FORBIDDEN_WORDS
          CLAS_DEMO_ACCESS_PASSWORD=$CLAS_DEMO_ACCESS_PASSWORD
          CLAS_IMAGE_TAG=$CLAS_IMAGE_TAG
          CLAS_STOP_LEGACY_NGINX=true
          EOF

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy tested image version through server-local k3s API
        run: |
          deploy_env="/tmp/clas-deploy.env"
          ssh_options="-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          sshpass -p "$SSH_PASSWORD" scp $ssh_options "$RUNNER_TEMP/clas-deploy.env" "root@${SERVER_HOST}:$deploy_env"
          sshpass -p "$SSH_PASSWORD" ssh $ssh_options "root@${SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          deploy_env="/tmp/clas-deploy.env"
          trap 'rm -f "$deploy_env"' EXIT
          set -a
          . /etc/clas/clas.env
          . "$deploy_env"
          set +a
          if [ ! -d /opt/clas-k8s/.git ]; then
            git clone --origin upstream https://github.com/Amyjinru/CLAS.git /opt/clas-k8s
          fi
          cd /opt/clas-k8s
          git fetch upstream main
          git checkout --detach "$CLAS_IMAGE_TAG"
          test "$(git rev-parse HEAD)" = "$CLAS_IMAGE_TAG"
          pull_image() {
            local image="$1"
            for attempt in 1 2 3; do
              if timeout 180 k3s ctr -n k8s.io images pull \
                --user "${GHCR_USERNAME}:${GHCR_TOKEN}" "$image"; then
                return 0
              fi
              echo "Image pull attempt ${attempt} failed: ${image}" >&2
            done
            return 1
          }
          pull_image "ghcr.io/amyjinru/clas-database:${CLAS_IMAGE_TAG}"
          pull_image "ghcr.io/amyjinru/clas-backend:${CLAS_IMAGE_TAG}"
          pull_image "ghcr.io/amyjinru/clas-frontend:${CLAS_IMAGE_TAG}"
          bash scripts/k8s/deploy.sh "$CLAS_IMAGE_TAG"
          REMOTE

      - name: Collect server deployment diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-diagnostics"
          sshpass -p "$SSH_PASSWORD" scp -r -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@${SERVER_HOST}:/opt/clas-k8s/artifacts/k8s-diagnostics/." "$RUNNER_TEMP/k8s-diagnostics/" || true

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k3s-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/k8s-diagnostics/
          if-no-files-found: warn
