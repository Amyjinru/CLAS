name: CLAS CI/CD

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend unit tests
        working-directory: backend
        run: mvn --batch-mode test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  integration-test:
    name: Integration test
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start container stack
        env:
          MYSQL_PASSWORD: ci-db-password
          JWT_SECRET: ci-jwt-secret
        run: docker compose up --build -d
      - name: Run integration checks
        env:
          BASE_URL: http://localhost
          BACKEND_URL: http://localhost:8080
        run: bash scripts/integration-test.sh
      - name: Upload integration evidence
        if: always()
        run: docker compose logs --no-color > integration-docker.log
      - name: Preserve integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-${{ github.sha }}
          path: integration-docker.log
      - name: Stop container stack
        if: always()
        run: docker compose down -v

  publish-images:
    name: Build and publish images
    needs: integration-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/clas-backend:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/clas-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Kubernetes
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
      - name: Apply Kubernetes resources
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create configmap clas-db-init --namespace clas --from-file=00-schema.sql=database/schema.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/mysql.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl -n clas set image deployment/clas-backend backend=${{ env.IMAGE_PREFIX }}/clas-backend:${{ env.IMAGE_TAG }}
          kubectl -n clas set image deployment/clas-frontend frontend=${{ env.IMAGE_PREFIX }}/clas-frontend:${{ env.IMAGE_TAG }}
          kubectl -n clas rollout status deployment/clas-mysql --timeout=180s
          kubectl -n clas rollout status deployment/clas-redis --timeout=180s
          kubectl -n clas rollout status deployment/clas-backend --timeout=180s
          kubectl -n clas rollout status deployment/clas-frontend --timeout=180s
      - name: Preserve deployment evidence
        if: always()
        run: |
          kubectl -n clas get all -o wide > kubernetes-resources.log
          kubectl -n clas describe deployments > kubernetes-describe.log
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: kubernetes-*.log

  health-check:
    name: Health check
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
      - name: Check backend health
        run: |
          kubectl -n clas run clas-health-${{ github.run_id }} --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- curl --fail --silent http://clas-backend:8080/api/health
      - name: Preserve health evidence
        if: always()
        run: kubectl -n clas get pods -o wide > health-pods.log
      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-evidence-${{ github.sha }}
          path: health-pods.log
