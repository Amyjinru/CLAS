<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 小爱心 -->
    <g id="lace-heart">
      <path d="M0,1.5 C0,1.5 -2.5,-0.8 -2.5,-3 C-2.5,-4.8 -1,-6 0,-4 C1,-6 2.5,-4.8 2.5,-3 C2.5,-0.8 0,1.5 0,1.5Z"/>
    </g>
    <!-- 小四瓣花 -->
    <g id="lace-floret">
      <ellipse cx="0" cy="-2" rx="1.2" ry="2.2"/>
      <ellipse cx="2" cy="0" rx="1.2" ry="2.2" transform="rotate(90)"/>
      <ellipse cx="0" cy="2" rx="1.2" ry="2.2"/>
      <ellipse cx="-2" cy="0" rx="1.2" ry="2.2" transform="rotate(90)"/>
    </g>
  </defs>

  <!-- ════════════ 四角花朵装饰 (各 12×12) ════════════ -->
  <g fill="#FFB5A7" opacity="0.65">
    <!-- 左上角 — 五瓣小花 -->
    <circle cx="6" cy="6" r="3.5"/>
    <circle cx="10.5" cy="3.5" r="2.2"/>
    <circle cx="11" cy="8.5" r="2.2"/>
    <circle cx="3" cy="2.5" r="2.2"/>
    <circle cx="2.5" cy="9" r="2.2"/>
    <circle cx="6" cy="6" r="1.8" fill="#FFD100" opacity="0.8"/>
  </g>
  <g fill="#FFB5A7" opacity="0.65">
    <!-- 右上角 -->
    <circle cx="42" cy="6" r="3.5"/>
    <circle cx="46.5" cy="3.5" r="2.2"/>
    <circle cx="47" cy="8.5" r="2.2"/>
    <circle cx="39" cy="2.5" r="2.2"/>
    <circle cx="38.5" cy="9" r="2.2"/>
    <circle cx="42" cy="6" r="1.8" fill="#FFD100" opacity="0.8"/>
  </g>
  <g fill="#FFB5A7" opacity="0.65">
    <!-- 左下角 -->
    <circle cx="6" cy="42" r="3.5"/>
    <circle cx="10.5" cy="39.5" r="2.2"/>
    <circle cx="11" cy="44.5" r="2.2"/>
    <circle cx="3" cy="38.5" r="2.2"/>
    <circle cx="2.5" cy="45" r="2.2"/>
    <circle cx="6" cy="42" r="1.8" fill="#FFD100" opacity="0.8"/>
  </g>
  <g fill="#FFB5A7" opacity="0.65">
    <!-- 右下角 -->
    <circle cx="42" cy="42" r="3.5"/>
    <circle cx="46.5" cy="39.5" r="2.2"/>
    <circle cx="47" cy="44.5" r="2.2"/>
    <circle cx="39" cy="38.5" r="2.2"/>
    <circle cx="38.5" cy="45" r="2.2"/>
    <circle cx="42" cy="42" r="1.8" fill="#FFD100" opacity="0.8"/>
  </g>

  <!-- ════════════ 上边缘 — 波浪蕾丝 ════════════ -->
  <g fill="none" stroke="#FFB5A7" stroke-width="1" opacity="0.5">
    <path d="M14,5 Q17,11 20,5 Q23,11 26,5 Q29,11 32,5 Q35,11 38,5"/>
  </g>
  <g fill="none" stroke="#A8DADC" stroke-width="0.8" opacity="0.4">
    <path d="M15,2 Q18,5 21,2 Q24,5 27,2 Q30,5 33,2 Q36,5 39,2"/>
  </g>
  <!-- 上边小圆点 -->
  <circle cx="16" cy="3.5" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="22" cy="3.5" r="1" fill="#FFB5A7" opacity="0.45"/>
  <circle cx="28" cy="3.5" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="34" cy="3.5" r="1" fill="#A8DADC" opacity="0.4"/>

  <!-- ════════════ 下边缘 — 波浪蕾丝 ════════════ -->
  <g fill="none" stroke="#FFB5A7" stroke-width="1" opacity="0.5">
    <path d="M14,43 Q17,37 20,43 Q23,37 26,43 Q29,37 32,43 Q35,37 38,43"/>
  </g>
  <g fill="none" stroke="#A8DADC" stroke-width="0.8" opacity="0.4">
    <path d="M15,46 Q18,43 21,46 Q24,43 27,46 Q30,43 33,46 Q36,43 39,46"/>
  </g>
  <circle cx="16" cy="44.5" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="22" cy="44.5" r="1" fill="#FFB5A7" opacity="0.45"/>
  <circle cx="28" cy="44.5" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="34" cy="44.5" r="1" fill="#A8DADC" opacity="0.4"/>

  <!-- ════════════ 左边缘 — 波浪蕾丝 ════════════ -->
  <g fill="none" stroke="#FFB5A7" stroke-width="1" opacity="0.5">
    <path d="M5,14 Q11,17 5,20 Q11,23 5,26 Q11,29 5,32 Q11,35 5,38"/>
  </g>
  <circle cx="3.5" cy="16" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="3.5" cy="22" r="1" fill="#FFB5A7" opacity="0.45"/>
  <circle cx="3.5" cy="28" r="1.2" fill="#A8DADC" opacity="0.4"/>
  <circle cx="3.5" cy="34" r="1" fill="#FFD100" opacity="0.45"/>

  <!-- ════════════ 右边缘 — 波浪蕾丝 ════════════ -->
  <g fill="none" stroke="#FFB5A7" stroke-width="1" opacity="0.5">
    <path d="M43,14 Q37,17 43,20 Q37,23 43,26 Q37,29 43,32 Q37,35 43,38"/>
  </g>
  <circle cx="44.5" cy="16" r="1.2" fill="#FFD100" opacity="0.5"/>
  <circle cx="44.5" cy="22" r="1" fill="#FFB5A7" opacity="0.45"/>
  <circle cx="44.5" cy="28" r="1.2" fill="#A8DADC" opacity="0.4"/>
  <circle cx="44.5" cy="34" r="1" fill="#FFD100" opacity="0.45"/>

  <!-- ════════════ 角内侧柔光 ════════════ -->
  <circle cx="12" cy="12" r="2" fill="#FEC89A" opacity="0.25"/>
  <circle cx="36" cy="12" r="2" fill="#FEC89A" opacity="0.25"/>
  <circle cx="12" cy="36" r="2" fill="#FEC89A" opacity="0.25"/>
  <circle cx="36" cy="36" r="2" fill="#FEC89A" opacity="0.25"/>
</svg>