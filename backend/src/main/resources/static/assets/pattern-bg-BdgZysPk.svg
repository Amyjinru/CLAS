<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <defs>
    <!-- 柔光滤镜 -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 五角星 -->
    <g id="star">
      <polygon points="0,-9 2.5,-3 9,-3 4,1.5 5.5,8 0,4.5 -5.5,8 -4,1.5 -9,-3 -2.5,-3" fill="currentColor"/>
    </g>
    <!-- 四角星/闪亮 -->
    <g id="sparkle">
      <path d="M0,-8 Q0,0 8,0 Q0,0 0,8 Q0,0 -8,0 Q0,0 0,-8Z" fill="currentColor"/>
    </g>
    <!-- 小心形 -->
    <g id="heart">
      <path d="M0,3 C0,3 -6,-1 -6,-5 C-6,-8 -3,-9 0,-6 C3,-9 6,-8 6,-5 C6,-1 0,3 0,3Z" fill="currentColor"/>
    </g>
    <!-- 小花（5瓣） -->
    <g id="flower">
      <ellipse cx="0" cy="-5" rx="2.5" ry="4.5" fill="currentColor"/>
      <ellipse cx="4.8" cy="-1.5" rx="2.5" ry="4.5" fill="currentColor" transform="rotate(72)"/>
      <ellipse cx="3" cy="4" rx="2.5" ry="4.5" fill="currentColor" transform="rotate(144)"/>
      <ellipse cx="-3" cy="4" rx="2.5" ry="4.5" fill="currentColor" transform="rotate(216)"/>
      <ellipse cx="-4.8" cy="-1.5" rx="2.5" ry="4.5" fill="currentColor" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="2" fill="#FFF4CC"/>
    </g>
    <!-- 小叶子 -->
    <g id="leaf">
      <path d="M0,0 Q4,-6 0,-12 Q-4,-6 0,0Z" fill="currentColor"/>
    </g>
    <!-- 圆点簇 -->
    <g id="dotCluster">
      <circle cx="0" cy="0" r="3" fill="currentColor"/>
      <circle cx="6" cy="2" r="1.8" fill="currentColor" opacity="0.6"/>
      <circle cx="-5" cy="3" r="2.2" fill="currentColor" opacity="0.7"/>
    </g>
  </defs>

  <!-- ═══════════ 透明底（让 CSS 底色透出） ═══════════ -->

  <!-- ═══ 区域：大号 CLAS 文字（中心偏左） ═══ -->
  <!-- 文字光晕 -->
  <text x="75" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', serif" font-size="62" font-weight="900" letter-spacing="8" fill="#FFF4CC" opacity="0.7" filter="url(#softGlow)">CLAS</text>

  <!-- 主文字 — 每个字母不同颜色 -->
  <text x="42" y="135" text-anchor="start" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', serif" font-size="60" font-weight="900" letter-spacing="6" fill="#FFB5A7">CLA</text>
  <text x="145" y="135" text-anchor="start" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', serif" font-size="60" font-weight="900" letter-spacing="6" fill="#A8DADC">S</text>

  <!-- 文字下方装饰线 -->
  <line x1="28" y1="145" x2="172" y2="145" stroke="#FEC89A" stroke-width="1.5" opacity="0.8" stroke-dasharray="4 3"/>
  <line x1="40" y1="150" x2="160" y2="150" stroke="#FFD100" stroke-width="1" opacity="0.5"/>

  <!-- ═══ 区域：小号 CLAS 点缀 ═══ -->
  <!-- 左上角 -->
  <text x="40" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="3" fill="#FEC89A" opacity="0.6">CLAS</text>
  <!-- 右上角 -->
  <text x="320" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="3" fill="#FFB5A7" opacity="0.5">CLAS</text>
  <!-- 左下 -->
  <text x="38" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" letter-spacing="3" fill="#A8DADC" opacity="0.5">CLAS</text>
  <!-- 右下 -->
  <text x="320" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="3" fill="#FEC89A" opacity="0.55">CLAS</text>
  <!-- 中右 -->
  <text x="290" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="3" fill="#FFB5A7" opacity="0.45" transform="rotate(15, 290, 130)">CLAS</text>

  <!-- ═══ 星星 ═══ -->
  <!-- 左上区域 -->
  <use href="#star" x="70" y="38" color="#FFD100" opacity="0.55" transform="scale(1.4) translate(-20,-11)"/>
  <use href="#star" x="90" y="25" color="#FFB5A7" opacity="0.5" transform="scale(0.9) translate(10,3)"/>
  <use href="#star" x="20" y="60" color="#A8DADC" opacity="0.4" transform="scale(0.7) translate(12,35)"/>

  <!-- 右上区域 -->
  <use href="#star" x="310" y="65" color="#FFD100" opacity="0.45"/>
  <use href="#star" x="340" y="30" color="#FFB5A7" opacity="0.5" transform="scale(0.8) translate(68,6)"/>
  <use href="#star" x="280" y="85" color="#FEC89A" opacity="0.4" transform="scale(0.6) translate(187,57)"/>

  <!-- 左下区域 -->
  <use href="#star" x="50" y="170" color="#FFB5A7" opacity="0.45" transform="scale(0.9) translate(6,-19)"/>
  <use href="#star" x="15" y="195" color="#FFD100" opacity="0.4" transform="scale(0.7) translate(9,80)"/>

  <!-- 右下区域 -->
  <use href="#star" x="330" y="180" color="#A8DADC" opacity="0.45" transform="scale(1.1) translate(-30,-16)"/>
  <use href="#star" x="310" y="210" color="#FFD100" opacity="0.4"/>
  <use href="#star" x="350" y="155" color="#FFB5A7" opacity="0.35" transform="scale(0.6) translate(233,103)"/>

  <!-- ═══ 闪亮/四角星 ═══ -->
  <use href="#sparkle" x="105" y="60" color="#FFD100" opacity="0.5" transform="scale(0.9) translate(12,7)"/>
  <use href="#sparkle" x="270" y="50" color="#FFB5A7" opacity="0.45" transform="scale(0.8) translate(68,13)"/>
  <use href="#sparkle" x="60" y="155" color="#A8DADC" opacity="0.4" transform="scale(0.7) translate(26,67)"/>
  <use href="#sparkle" x="300" y="150" color="#FFD100" opacity="0.45" transform="scale(0.8) translate(-75,37)"/>
  <use href="#sparkle" x="200" y="28" color="#FEC89A" opacity="0.4" transform="scale(0.6) translate(133,18)"/>
  <use href="#sparkle" x="160" y="210" color="#FFB5A7" opacity="0.4" transform="scale(0.65) translate(86,113)"/>

  <!-- ═══ 爱心 ═══ -->
  <use href="#heart" x="130" y="45" color="#FFB5A7" opacity="0.5" transform="scale(1.1) translate(-12,-4)"/>
  <use href="#heart" x="260" y="100" color="#FF9F8F" opacity="0.4"/>
  <use href="#heart" x="45" y="90" color="#FCD5CE" opacity="0.5" transform="scale(0.8) translate(11,23)"/>
  <use href="#heart" x="290" y="195" color="#FFB5A7" opacity="0.4" transform="scale(0.85) translate(-51,34)"/>
  <use href="#heart" x="180" y="185" color="#FCD5CE" opacity="0.35"/>
  <use href="#heart" x="340" y="110" color="#FFB5A7" opacity="0.35" transform="scale(0.7) translate(146,47)"/>

  <!-- ═══ 小花 ═══ -->
  <use href="#flower" x="30" y="100" color="#FFB5A7" opacity="0.55" transform="scale(1.2) translate(-5,-17)"/>
  <use href="#flower" x="300" y="45" color="#A8DADC" opacity="0.45" transform="scale(1.0) translate(0,0)"/>
  <use href="#flower" x="100" y="180" color="#FEC89A" opacity="0.45" transform="scale(0.9) translate(11,20)"/>
  <use href="#flower" x="260" y="170" color="#FFB5A7" opacity="0.4" transform="scale(0.85) translate(-46,30)"/>
  <use href="#flower" x="200" y="70" color="#FCD5CE" opacity="0.4" transform="scale(0.75) translate(67,23)"/>
  <use href="#flower" x="15" y="160" color="#A8DADC" opacity="0.35" transform="scale(0.7) translate(8,68)"/>

  <!-- ═══ 小叶子 ═══ -->
  <use href="#leaf" x="48" y="108" color="#A8DADC" opacity="0.4" transform="rotate(-30, 48, 108) scale(0.8)"/>
  <use href="#leaf" x="312" y="108" color="#A8DADC" opacity="0.35" transform="rotate(20, 312, 108) scale(0.7)"/>
  <use href="#leaf" x="115" y="188" color="#A8DADC" opacity="0.35" transform="rotate(-45, 115, 188) scale(0.7)"/>
  <use href="#leaf" x="85" y="75" color="#C3E8D4" opacity="0.35" transform="rotate(15, 85, 75) scale(0.6)"/>

  <!-- ═══ 圆点簇 ═══ -->
  <use href="#dotCluster" x="160" y="55" color="#FFD100" opacity="0.4"/>
  <use href="#dotCluster" x="22" y="130" color="#FFB5A7" opacity="0.35" transform="scale(0.7) translate(12,56)"/>
  <use href="#dotCluster" x="300" y="130" color="#FEC89A" opacity="0.35" transform="scale(0.8) translate(-75,32)"/>
  <use href="#dotCluster" x="100" y="160" color="#A8DADC" opacity="0.3" transform="scale(0.7) translate(43,68)"/>

  <!-- ═══ 装饰小圆点 ═══ -->
  <circle cx="55" cy="50" r="2" fill="#FFD100" opacity="0.45"/>
  <circle cx="145" cy="35" r="1.8" fill="#FFB5A7" opacity="0.4"/>
  <circle cx="240" cy="40" r="2.2" fill="#A8DADC" opacity="0.35"/>
  <circle cx="335" cy="75" r="1.5" fill="#FEC89A" opacity="0.4"/>
  <circle cx="70" cy="140" r="1.8" fill="#FFD100" opacity="0.35"/>
  <circle cx="250" cy="140" r="2" fill="#FFB5A7" opacity="0.3"/>
  <circle cx="40" cy="205" r="1.8" fill="#FFD100" opacity="0.35"/>
  <circle cx="180" cy="220" r="2" fill="#A8DADC" opacity="0.3"/>
  <circle cx="280" cy="220" r="1.5" fill="#FEC89A" opacity="0.35"/>
  <circle cx="350" cy="200" r="2" fill="#FFB5A7" opacity="0.3"/>

  <!-- ═══ 底部横贯装饰波纹 ═══ -->
  <path d="M0,232 Q40,226 80,232 Q120,238 160,232 Q200,226 240,232 Q280,238 320,232 Q350,226 360,230" fill="none" stroke="#FFB5A7" stroke-width="1" opacity="0.3"/>
  <path d="M0,235 Q40,229 80,235 Q120,241 160,235 Q200,229 240,235 Q280,241 320,235 Q350,229 360,233" fill="none" stroke="#FFD100" stroke-width="0.8" opacity="0.25"/>

  <!-- ═══ 顶部横贯装饰 ═══ -->
  <path d="M0,8 Q30,4 60,8 Q90,12 120,8 Q150,4 180,8 Q210,12 240,8 Q270,4 300,8 Q330,12 360,8" fill="none" stroke="#A8DADC" stroke-width="0.8" opacity="0.25"/>
</svg>