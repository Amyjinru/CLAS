<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .food-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3.2;
      }
      .food-path-thin {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.2;
      }
