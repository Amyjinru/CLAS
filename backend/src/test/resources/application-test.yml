spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:clas;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379

clas:
  verification:
    fixed-code: "123456"

jwt:
  secret: clas-test-secret-key-2026-must-be-32bytes!
