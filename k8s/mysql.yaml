apiVersion: v1
kind: Service
metadata:
  name: clas-mysql
  namespace: clas
spec:
  selector:
    app: clas-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-mysql
  namespace: clas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clas-mysql
  template:
    metadata:
      labels:
        app: clas-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: clas
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clas-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/00-schema.sql
              subPath: 00-schema.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clas-mysql-data
        - name: init
          configMap:
            name: clas-db-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clas-mysql-data
  namespace: clas
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
