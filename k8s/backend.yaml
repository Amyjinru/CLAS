apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: clas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/amyjinru/clas-backend:REQUIRED_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: clas-config}
            - secretRef: {name: clas-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /api/health, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: clas
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
