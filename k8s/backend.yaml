apiVersion: v1
kind: Service
metadata:
  name: clas-backend
  namespace: clas
spec:
  selector:
    app: clas-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-backend
  namespace: clas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clas-backend
  template:
    metadata:
      labels:
        app: clas-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/REPLACE_OWNER/clas-backend:REPLACE_SHA
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: clas-config
          env:
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clas-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clas-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
