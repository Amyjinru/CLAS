# 模板文件：请使用 scripts/k8s/deploy.sh 从环境变量创建真实 Secret，禁止提交真实值。
apiVersion: v1
kind: Secret
metadata:
  name: clas-secrets
  namespace: clas
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-me
  MYSQL_ORDER_PASSWORD: replace-me
  MYSQL_IAM_PASSWORD: replace-me
  MYSQL_MERCHANT_PASSWORD: replace-me
  MYSQL_CATALOG_PASSWORD: replace-me
  MYSQL_COMPAT_PASSWORD: replace-me
  JWT_SECRET: replace-with-at-least-32-random-bytes
  CLAS_INTERNAL_API_KEY: replace-with-a-long-random-service-key
  RIDER_IDENTITY_ENCRYPTION_KEY: replace-with-a-32-byte-aes-key
  AMAP_WEB_SERVICE_KEY: ""
  DASHSCOPE_API_KEY: ""
  FORBIDDEN_WORDS: ""
  CLAS_DEMO_ACCESS_PASSWORD: ""
