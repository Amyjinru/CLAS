apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clas-catalog
  namespace: clas
  labels:
    app: clas-catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clas-catalog
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      # Avoid reacting to short JVM start-up/request spikes on the single-node
      # cluster.  A sustained signal must remain above target for one minute.
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 120
    scaleDown:
      # Keep a newly-created Pod around long enough for traffic and metrics to
      # settle, preventing rapid 1<->2 oscillation.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
