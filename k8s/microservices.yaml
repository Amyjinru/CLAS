# Apply after namespace.yaml, configmap.yaml, secret creation, mysql.yaml and redis.yaml.
# Replace REQUIRED_TAG with one immutable image tag before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-iam
  namespace: clas
spec:
  replicas: 1
  selector: {matchLabels: {app: clas-iam}}
  template:
    metadata: {labels: {app: clas-iam}}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: clas-iam
          image: ghcr.io/amyjinru/clas-iam:REQUIRED_TAG
          ports: [{containerPort: 8081}]
          envFrom: [{configMapRef: {name: clas-config}}, {secretRef: {name: clas-secrets}}]
          env:
            - {name: CLAS_IAM_HOST, value: clas-iam}
            - {name: CLAS_CATALOG_HOST, value: clas-catalog}
            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          readinessProbe: {httpGet: {path: /api/health, port: 8081}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8081}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: clas-iam, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-iam}
  ports: [{name: http, port: 8081, targetPort: 8081}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: clas-catalog-uploads, namespace: clas}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-catalog
  namespace: clas
spec:
  replicas: 1
  selector: {matchLabels: {app: clas-catalog}}
  template:
    metadata: {labels: {app: clas-catalog}}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: clas-catalog
          image: ghcr.io/amyjinru/clas-catalog:REQUIRED_TAG
          ports: [{containerPort: 8082}]
          envFrom: [{configMapRef: {name: clas-config}}, {secretRef: {name: clas-secrets}}]
          env:
            - {name: CLAS_IAM_HOST, value: clas-iam}
            - {name: CLAS_CATALOG_HOST, value: clas-catalog}
            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          volumeMounts: [{name: uploads, mountPath: /app/uploads}]
          readinessProbe: {httpGet: {path: /api/health, port: 8082}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8082}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: uploads, persistentVolumeClaim: {claimName: clas-catalog-uploads}}]
---
apiVersion: v1
kind: Service
metadata: {name: clas-catalog, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-catalog}
  ports: [{name: http, port: 8082, targetPort: 8082}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-order
  namespace: clas
spec:
  replicas: 1
  selector: {matchLabels: {app: clas-order}}
  template:
    metadata: {labels: {app: clas-order}}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: clas-order
          image: ghcr.io/amyjinru/clas-order:REQUIRED_TAG
          ports: [{containerPort: 8083}]
          envFrom: [{configMapRef: {name: clas-config}}, {secretRef: {name: clas-secrets}}]
          env:
            - {name: CLAS_IAM_HOST, value: clas-iam}
            - {name: CLAS_CATALOG_HOST, value: clas-catalog}
            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          readinessProbe: {httpGet: {path: /api/health, port: 8083}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8083}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: 750m, memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: clas-order, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-order}
  ports: [{name: http, port: 8083, targetPort: 8083}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
