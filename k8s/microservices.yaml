# Apply after namespace.yaml, configmap.yaml, secret creation, mysql.yaml and redis.yaml.
# Replace REQUIRED_TAG with one immutable image tag before applying.
#
# Uploads use a PVC (required). The PV is statically bound to the existing
# node directory so historical avatars, logos and product images stay readable.
# Do not switch this PVC to a dynamically provisioned empty volume: that is
# what blanked out /uploads after the split.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clas-uploads
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clas-uploads
  hostPath: {path: /opt/clas/backend/uploads, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: clas-uploads, namespace: clas}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: clas-uploads
  volumeName: clas-uploads
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-iam
  namespace: clas
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: clas-iam}}
  template:
    metadata: {labels: {app: clas-iam}}
    spec:
      # Kubernetes service-link variables such as CLAS_IAM_PORT contain
      # tcp://host:port and collide with Spring's integer port properties.
      enableServiceLinks: false
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: clas-iam
          image: ghcr.io/amyjinru/clas-iam:REQUIRED_TAG
          ports: [{containerPort: 8081}]
          envFrom: [{configMapRef: {name: clas-config}}, {secretRef: {name: clas-secrets}}]
          env:
            - {name: CLAS_IAM_HOST, value: clas-iam}
            - {name: CLAS_MERCHANT_HOST, value: clas-merchant}
            - {name: CLAS_CATALOG_HOST, value: clas-catalog}
            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          # LocalFileStorage writes /app/uploads/avatars/<userId>/... .
          volumeMounts: [{name: uploads, mountPath: /app/uploads}]
          startupProbe: {httpGet: {path: /api/health, port: 8081}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /api/health, port: 8081}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /api/health, port: 8081}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: clas-uploads}
---
apiVersion: v1
kind: Service
metadata: {name: clas-iam, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-iam}
  ports: [{name: http, port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-merchant
  namespace: clas
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: clas-merchant}}
  template:
    metadata: {labels: {app: clas-merchant}}
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: clas-merchant
          image: ghcr.io/amyjinru/clas-merchant:REQUIRED_TAG
          ports: [{containerPort: 8085}]
          envFrom: [{configMapRef: {name: clas-config}}, {secretRef: {name: clas-secrets}}]
          env:
            - {name: CLAS_IAM_HOST, value: clas-iam}
            - {name: CLAS_MERCHANT_HOST, value: clas-merchant}
            - {name: CLAS_CATALOG_HOST, value: clas-catalog}
            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          # LocalFileStorage writes /app/uploads/merchant-logo/<merchantId>/... .
          volumeMounts: [{name: uploads, mountPath: /app/uploads}]
          startupProbe: {httpGet: {path: /api/health, port: 8085}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /api/health, port: 8085}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /api/health, port: 8085}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: clas-uploads}
---
apiVersion: v1
kind: Service
metadata: {name: clas-merchant, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-merchant}
  ports: [{name: http, port: 8085, targetPort: 8085}]
---
