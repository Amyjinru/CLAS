            - {name: CLAS_ORDER_HOST, value: clas-order}
            - {name: CLAS_COMPAT_HOST, value: clas-compat}
          readinessProbe: {httpGet: {path: /api/health, port: 8084}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8084}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: 750m, memory: 768Mi}}
---
apiVersion: v1
kind: Service
