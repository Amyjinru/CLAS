apiVersion: v1
kind: ConfigMap
metadata:
  name: clas-config
  namespace: clas
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: clas
  # 未跑 isolate 前保持 clas。P3 后再按服务增加 MYSQL_IAM_USER 等，勿在 isolate 前改默认值。
  MYSQL_USER: clas
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CHAT_MODERATION_TIMEOUT_MS: "3000"
  CLAS_DEMO_ACCOUNTS_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "http://8.141.112.182"
