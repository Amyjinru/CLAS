apiVersion: batch/v1
kind: Job
metadata:
  name: clas-db-migrate
  namespace: clas
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/amyjinru/clas-database:REQUIRED_TAG
          envFrom:
            - configMapRef: {name: clas-config}
            - secretRef: {name: clas-secrets}
          env:
            - name: MYSQL_USER
              value: root
