apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clas
  namespace: clas
  annotations:
    # 获得真实域名后可增加 spec.rules.host 与 cert-manager TLS Secret。
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clas-gateway
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: clas-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
