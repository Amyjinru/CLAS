apiVersion: v1
kind: ConfigMap
metadata:
  name: clas-gateway-config
  namespace: clas
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 8080;
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;

        location ^~ /api/user { proxy_pass http://clas-iam:8081; }
        location ^~ /api/address { proxy_pass http://clas-iam:8081; }
        location ^~ /api/favorites { proxy_pass http://clas-iam:8081; }
        location ^~ /api/role-applications { proxy_pass http://clas-iam:8081; }
        location ^~ /api/notifications { proxy_pass http://clas-iam:8081; }

        location ^~ /uploads/ { proxy_pass http://clas-catalog:8082; }
        location ^~ /api/merchant { proxy_pass http://clas-catalog:8082; }
        location ^~ /api/product { proxy_pass http://clas-catalog:8082; }
        location ^~ /api/bookings { proxy_pass http://clas-catalog:8082; }
        location ^~ /api/deals/merchant { proxy_pass http://clas-catalog:8082; }
        location ~ ^/api/deals/(mine|redeem-logs|redeem|orders) { proxy_pass http://clas-order:8083; }
        location ~ ^/api/deals/[0-9]+/buy$ { proxy_pass http://clas-order:8083; }
        # Do not use ^~ here: the two regex locations above must keep taking
        # precedence for order-owned buy, redeem and redemption-log routes.
        location /api/deals { proxy_pass http://clas-catalog:8082; }

        location ^~ /api/cart { proxy_pass http://clas-order:8083; }
        location ^~ /api/order { proxy_pass http://clas-order:8083; }
        location ^~ /api/payment { proxy_pass http://clas-order:8083; }
        location ^~ /api/coupon { proxy_pass http://clas-order:8083; }
        location ^~ /api/review { proxy_pass http://clas-order:8083; }

        location ^~ /api/rider { proxy_pass http://clas-compat:8084; }
        location ^~ /api/delivery { proxy_pass http://clas-compat:8084; }
        location ^~ /api/chat { proxy_pass http://clas-compat:8084; }
        location ^~ /api/admin { proxy_pass http://clas-compat:8084; }
        location ^~ /api/announcement { proxy_pass http://clas-compat:8084; }
        location ^~ /api/public { proxy_pass http://clas-compat:8084; }
        location = /api/health { proxy_pass http://clas-iam:8081/api/health; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clas-gateway
  namespace: clas
spec:
  replicas: 1
  selector: {matchLabels: {app: clas-gateway}}
  template:
    metadata: {labels: {app: clas-gateway}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}]
          readinessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
      volumes: [{name: config, configMap: {name: clas-gateway-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: clas-gateway, namespace: clas}
spec:
  type: ClusterIP
  selector: {app: clas-gateway}
  ports: [{name: http, port: 8080, targetPort: 8080}]
