worker_processes 1;

error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type  application/json;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    client_body_temp_path logs/client_body_temp;
    proxy_temp_path logs/proxy_temp;
    fastcgi_temp_path logs/fastcgi_temp;
    uwsgi_temp_path logs/uwsgi_temp;
    scgi_temp_path logs/scgi_temp;

    upstream clas_iam {
        server 127.0.0.1:8081;
    }
    upstream clas_catalog {
        server 127.0.0.1:8082;
    }
    upstream clas_order {
        server 127.0.0.1:8083;
    }
    upstream clas_compat {
        server 127.0.0.1:8084;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;

        # clas-iam
        location ^~ /api/user { proxy_pass http://clas_iam; }
        location ^~ /api/address { proxy_pass http://clas_iam; }
        location ^~ /api/favorites { proxy_pass http://clas_iam; }
        location ^~ /api/role-applications { proxy_pass http://clas_iam; }
        location ^~ /api/notifications { proxy_pass http://clas_iam; }

        # clas-catalog
        location ^~ /uploads/ { proxy_pass http://clas_catalog; }
        location ^~ /api/merchant { proxy_pass http://clas_catalog; }
        location ^~ /api/product { proxy_pass http://clas_catalog; }
        location ^~ /api/bookings { proxy_pass http://clas_catalog; }

        # 团购：商家发布走 catalog，购买/核销走 order
        location ^~ /api/deals/merchant { proxy_pass http://clas_catalog; }
        location ~ ^/api/deals/(mine|redeem-logs|redeem|orders) { proxy_pass http://clas_order; }
        location ~ ^/api/deals/[0-9]+/buy$ { proxy_pass http://clas_order; }
        location ^~ /api/deals { proxy_pass http://clas_catalog; }

        # clas-order
        location ^~ /api/cart { proxy_pass http://clas_order; }
        location ^~ /api/order { proxy_pass http://clas_order; }
        location ^~ /api/payment { proxy_pass http://clas_order; }
        location ^~ /api/coupon { proxy_pass http://clas_order; }
        location ^~ /api/review { proxy_pass http://clas_order; }

        # clas-compat
        location ^~ /api/rider { proxy_pass http://clas_compat; }
        location ^~ /api/delivery { proxy_pass http://clas_compat; }
        location ^~ /api/chat { proxy_pass http://clas_compat; }
        location ^~ /api/admin { proxy_pass http://clas_compat; }
        location ^~ /api/announcement { proxy_pass http://clas_compat; }
        location ^~ /api/public { proxy_pass http://clas_compat; }

        # 网关探活（转发 iam）
        location = /api/health {
            proxy_pass http://clas_iam/api/health;
        }
    }
}
