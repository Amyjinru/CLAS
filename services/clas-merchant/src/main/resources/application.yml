server:
  port: ${CLAS_MERCHANT_PORT:8085}

spring:
  application:
    name: clas-merchant
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_MERCHANT_DATABASE:${MYSQL_DATABASE:clas}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_MERCHANT_USER:${MYSQL_USER:root}}
    password: ${MYSQL_MERCHANT_PASSWORD:${MYSQL_PASSWORD:}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:clas-dev-secret-key-2026-must-be-32bytes!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

amap:
  web-service-key: ${AMAP_WEB_SERVICE_KEY:}

content-moderation:
  forbidden-words: ${FORBIDDEN_WORDS:}
  chat-api-timeout-ms: ${CHAT_MODERATION_TIMEOUT_MS:3000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}

clas:
  verification:
    fixed-code: ${CLAS_VERIFICATION_FIXEDCODE:}
  services:
    iam: http://${CLAS_IAM_HOST:localhost}:${CLAS_IAM_PORT:8081}
    merchant: http://${CLAS_MERCHANT_HOST:localhost}:${CLAS_MERCHANT_PORT:8085}
    catalog: http://${CLAS_CATALOG_HOST:localhost}:${CLAS_CATALOG_PORT:8082}
    order: http://${CLAS_ORDER_HOST:localhost}:${CLAS_ORDER_PORT:8083}
    compat: http://${CLAS_COMPAT_HOST:localhost}:${CLAS_COMPAT_PORT:8084}
  internal-api-key: ${CLAS_INTERNAL_API_KEY:}
