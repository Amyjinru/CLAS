server:
  port: ${CLAS_IAM_PORT:8081}

spring:
  application:
    name: clas-iam
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_IAM_DATABASE:${MYSQL_DATABASE:clas}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_IAM_USER:${MYSQL_USER:root}}
    password: ${MYSQL_IAM_PASSWORD:${MYSQL_PASSWORD:}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:clas-dev-secret-key-2026-must-be-32bytes!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

clas:
  verification:
    fixed-code: ${CLAS_VERIFICATION_FIXEDCODE:}
  demo-accounts:
    enabled: ${CLAS_DEMO_ACCOUNTS_ENABLED:false}
    access-password: ${CLAS_DEMO_ACCESS_PASSWORD:}
  services:
    iam: http://${CLAS_IAM_HOST:localhost}:${CLAS_IAM_PORT:8081}
    merchant: http://${CLAS_MERCHANT_HOST:localhost}:${CLAS_MERCHANT_PORT:8085}
    catalog: http://${CLAS_CATALOG_HOST:localhost}:${CLAS_CATALOG_PORT:8082}
    order: http://${CLAS_ORDER_HOST:localhost}:${CLAS_ORDER_PORT:8083}
    compat: http://${CLAS_COMPAT_HOST:localhost}:${CLAS_COMPAT_PORT:8084}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  text-model: ${DASHSCOPE_TEXT_MODEL:qwen3.6-flash}
  image-model: ${DASHSCOPE_IMAGE_MODEL:qwen3.5-flash}

content-moderation:
  forbidden-words: ${FORBIDDEN_WORDS:}
  chat-api-timeout-ms: ${CHAT_MODERATION_TIMEOUT_MS:3000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
